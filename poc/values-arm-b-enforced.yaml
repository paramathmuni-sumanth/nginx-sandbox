# Arm B — ENFORCED. Identical to Arm A but without the kubearmor-debug label, so
# the poc-prestop-block-exec policy applies. This reproduces the production
# collision: the microservice chart's default preStop is `sh -c ...`, and the
# policy blocks /bin/sh and /bin/busybox.
#
#   helm upgrade --install nginx-sandbox . -f values.yaml -f poc/values-arm-b-enforced.yaml

podLabels:
  kubearmor-policy: block-exec

terminationGracePeriodSeconds: 60

lifecycle:
  preStop:
    exec:
      command:
        - sh
        - -c
        - 'echo "PRESTOP_RAN arm=B-enforced ts=$(date -Is)" > /proc/1/fd/1; wget -qO- http://127.0.0.1:80/ >/dev/null 2>&1; sleep 3'
